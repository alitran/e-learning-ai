[project]
name = "e-learning-ai-api"
version = "0.1.0"
description = "Personalized AI learning platform API"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1.0",
  "asyncmy>=0.2.10",
  "cryptography>=42.0.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "PyJWT>=2.9.0",
  "ocrmypdf>=17.0.0,<18.0.0",
  "pypdf>=5.0.0",
  "python-multipart>=0.0.12",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
